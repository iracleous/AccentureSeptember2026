[project]
name = "day01"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Dimitris Iracleous", email = "iracleous@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "dotenv>=0.9.9",
    "fastapi>=0.141.1",
    "langchain>=1.3.18",
    "langchain-core>=1.6.1",
    "langchain-openai>=1.6.0",
    "langfuse>=4.15.1",
    "langgraph>=1.2.11",
    "pytest>=9.1.1",
    "uvicorn>=0.52.4",
]

[project.scripts]
day01 = "day01:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
